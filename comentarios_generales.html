<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentarios Generales | Curso QGIS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center py-5">
        
      

        <div class="col-12 col-md-8 col-lg-6">
            <div class="p-4 bg-darker border border-secondary rounded position-relative overflow-hidden animate-fade-in">
                
                <h3 class="fw-bold mb-4 text-white font-mono border-bottom border-dark pb-3">
                    <i class="bi bi-chat-dots text-qgis-light me-2"></i>Deja un comentario y puntuación de la <span class="text-qgis-yellow">exposición</span>
                </h3>

                <div id="alreadyCommented" class="d-none text-center py-4">
                    <i class="bi bi-check-circle-fill text-success fs-1 mb-3"></i>
                    <div id="previousRating" class="mt-2 mb-2"></div>
                    <p class="text-muted-light font-mono mt-2 mb-0">Ya enviaste tu comentario general. ¡Muchas gracias por tu retroalimentación!</p>
                </div>

                <div id="commentFormWrapper">
                    <form id="commentForm">
                        <div class="mb-4 text-center">
                            <label class="form-label font-mono small text-qgis-yellow d-block mb-3">
                                <i class="bi bi-star-fill me-1"></i>¿Cómo calificarías tu experiencia general?
                            </label>
                            <div class="star-rating d-flex justify-content-center gap-2" id="starRating">
                                <i class="bi bi-star fs-1 star-btn cursor-pointer" data-value="1"></i>
                                <i class="bi bi-star fs-1 star-btn cursor-pointer" data-value="2"></i>
                                <i class="bi bi-star fs-1 star-btn cursor-pointer" data-value="3"></i>
                                <i class="bi bi-star fs-1 star-btn cursor-pointer" data-value="4"></i>
                                <i class="bi bi-star fs-1 star-btn cursor-pointer" data-value="5"></i>
                            </div>
                            <input type="hidden" id="ratingValue" name="rating" value="0">
                        </div>
                        
                        <div class="mb-4">
                            <label for="commentContent" class="form-label font-mono small text-qgis-yellow">
                                <i class="bi bi-pencil-fill me-1"></i>Tu comentario
                            </label>
                            <textarea id="commentContent" class="comment-textarea form-control bg-transparent text-light border-secondary" rows="5" placeholder="Escribe tus opiniones, sugerencias o comentarios generales aquí..." required></textarea>
                        </div>
                        
                        <button type="submit" id="commentSubmitBtn" class="btn btn-qgis-primary w-100 btn-lg rounded-0 fw-bold font-mono border-0">
                            <i class="bi bi-send-fill me-2"></i>ENVIAR COMENTARIO
                        </button>
                        
                        <div id="commentSubmitStatus" class="d-none mt-3"></div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-dark text-center mt-auto">
        <div class="container font-mono small text-muted">
            <p class="mb-0"><i class="bi bi-c-circle me-1"></i> 2026 QGIS Aplicado a Proyectos de Ingeniería Civil.</p>
        </div>
    </footer>

    <style>
        .star-btn { cursor: pointer; transition: color 0.2s; color: rgba(255, 255, 255, 0.15); }
        .star-btn.active { color: #FEE028; }
        .bg-darker { background-color: #121212 !important; }
        .comment-textarea:focus { box-shadow: none; border-color: #93C038; }
    </style>

    <script src="assets/js/general_comments.js"></script>
</body>
</html>
