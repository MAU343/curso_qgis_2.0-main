<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Curso QGIS Civil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-dark text-light">

    <!-- Nav -->
    <nav class="navbar navbar-dark fixed-top custom-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-shield-lock me-2 text-qgis-light"></i>
                ADMIN <span class="text-qgis-yellow">QGIS</span>
            </a>
            <div class="d-none d-md-flex font-mono small text-muted-light">
                <i class="bi bi-people-fill me-1 text-qgis-light"></i>
                Panel de Registros
            </div>
        </div>
    </nav>

    <main class="container py-5" style="padding-top: 120px;">

        <!-- Login Section -->
        <section id="loginSection" class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="form-container p-5 border border-dark rounded-0 bg-dark">
                    <div class="text-center mb-4">
                        <div class="icon-box-small bg-qgis-dark text-qgis-light mx-auto mb-3" style="width:60px;height:60px;font-size:1.8rem;">
                            <i class="bi bi-person-badge"></i>
                        </div>
                        <h3 class="fw-bold">Acceso <span class="text-qgis-light">restringido</span></h3>
                        <p class="text-muted-light font-mono small"></p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUser" class="form-label font-mono small text-qgis-yellow">Usuario</label>
                            <input type="text" class="form-control bg-transparent border-secondary text-light custom-input" id="loginUser" required placeholder="adminqgis">
                        </div>
                        <div class="mb-3">
                            <label for="loginPass" class="form-label font-mono small text-qgis-yellow">Contrasena</label>
                            <input type="password" class="form-control bg-transparent border-secondary text-light custom-input" id="loginPass" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-qgis-primary w-100 btn-lg rounded-0 fw-bold font-mono border-0">
                            <i class="bi bi-box-arrow-in-right me-2"></i> INGRESAR
                        </button>
                        <div id="loginError" class="alert alert-danger d-none rounded-0 border-0 font-mono small mt-3"></div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboardSection" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-clipboard-data me-2 text-qgis-light"></i>
                        Registros del <span class="text-qgis-yellow">Curso</span>
                    </h2>
                    <p class="text-muted-light font-mono small mb-0" id="countInfo">Cargando...</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-qgis btn-sm font-mono" onclick="cargarRegistros()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
                    </button>
                    <button class="btn btn-outline-secondary btn-sm font-mono text-light border-secondary" onclick="cerrarSesion()">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </button>
                </div>
            </div>

            <!-- Export CSV -->
            <div class="mb-3 text-end">
                <button class="btn btn-qgis-primary btn-sm font-mono" onclick="exportarCSV()">
                    <i class="bi bi-download me-1"></i> Exportar CSV
                </button>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-dark table-striped table-bordered border-secondary font-mono small mb-0">
                    <thead class="text-qgis-yellow text-uppercase" style="background-color:#1e1e1e;">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Telefono</th>
                            <th>Profesion</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="registrosBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="d-none text-center py-5">
                <i class="bi bi-inbox fs-1 text-muted"></i>
                <p class="text-muted font-mono mt-2">No hay registros todavia.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-black py-3 border-top border-dark text-center fixed-bottom">
        <div class="container font-mono small text-muted">
            <i class="bi bi-c-circle me-1"></i> 2026 QGIS Aplicado a Proyectos de Ingenieria Civil
            <span class="mx-2">|</span>
            <a href="index.html" class="text-muted text-decoration-none">Volver al sitio</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
